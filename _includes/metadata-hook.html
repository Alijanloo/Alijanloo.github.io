<meta name="author" content="Ali Janloo, علی جانلو">

<!-- MathJax Configuration for Mathematical Formulas -->
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$','$$'], ['\\[','\\]']],
    processEscapes: true,
    processEnvironments: true
  },
  options: {
    ignoreHtmlClass: ".*|",
    processHtmlClass: "arithmatex"
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  "image": "{{ site.url }}{{ site.avatar }}",
  "sameAs": [
    "https://github.com/Alijanloo",
    "https://www.linkedin.com/in/ali-janloo/",
    "https://twitter.com/Alijanloo"
  ],
  "jobTitle": "ML Engineer",
  "worksFor": {
    "@type": "Organization",
    "name": "Parstech",
    "url": "https://parstechai.com/"
  },
  "alumniOf": {

    "name": "Ferdowsi University of Mashhad",
