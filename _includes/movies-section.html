<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#1f1d17;
  --surface-raised:#262319;
  --line:#3a362a;
  --paper:#eee7d6;
  --paper-dim:#b6ad97;
  --muted:#84795f;
  --gold:#e8b339;
  --gold-dim:#a37e2c;
  --sage:#7c9a73;
  --sage-dim:#3c4636;
  --rust:#c1693f;
  --rust-dim:#4a3526;
  --grey-flag:#8c8576;
  --grey-flag-dim:#37352c;
  --danger:#c1693f;
  --radius:10px;
  --shadow: 0 14px 34px -12px rgba(0,0,0,0.55);
}


::selection{ background:var(--gold); color:#1a1708; }

.movies-section{
  max-width:1280px;
  margin:0 auto;
  padding:0 24px 80px;
}

/* ===== Marquee header ===== */
.marquee{
  position:relative;
  margin:0 -24px 36px;
  padding:38px 24px 26px;

  border-bottom:1px solid var(--line);
  overflow:hidden;
}
.marquee::before,
.marquee::after{
  content:"";
  position:absolute;
  left:0; right:0;
  height:16px;
  background-image: radial-gradient(circle, var(--bg) 5px, transparent 5.5px);
  background-size: 28px 16px;
  background-repeat:repeat-x;
  background-position: 14px center;
}
.marquee::before{ top:-8px; }
.marquee::after{ bottom:-8px; }

.marquee-inner{
  position:relative;
  max-width:1280px;
  margin:0 auto;
}
.marquee-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--gold-dim);
  margin:0 0 6px;
}
.marquee h1{
  font-family:'Bebas Neue',sans-serif;
  font-weight:400;
  font-size:clamp(40px, 6vw, 64px);
  letter-spacing:0.04em;
  line-height:0.95;
  margin:0 0 18px;
  color:var(--paper);
  text-shadow: 0 2px 0 rgba(0,0,0,0.4);
}
.marquee h1 .accent{ color:var(--gold); }

.auth-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  font-size:13.5px;
}
.auth-row a{
  color:var(--paper);
  text-decoration:none;
  padding:8px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,0.02);
  transition:border-color .15s, color .15s, background .15s;
  font-weight:600;
}
.auth-row a:hover{ border-color:var(--gold-dim); color:var(--gold); background:rgba(232,179,57,0.06); }
.auth-row .sep{ color:var(--line); }
#authStatus{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--muted);
  letter-spacing:0.02em;
}
#authStatus.is-in{ color:var(--sage); }

/* ===== Add movie form ===== */
.add-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:flex-start;
  margin-bottom:8px;
}
.field-wrap{ flex:1 1 260px; position:relative; min-width:220px;}
.field-wrap input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  padding:13px 14px;
  border-radius:var(--radius);
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.field-wrap input::placeholder{ color:var(--muted); }
.field-wrap input:focus{
  border-color:var(--gold-dim);
  box-shadow:0 0 0 3px rgba(232,179,57,0.12);
}
.field-hint{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  margin:6px 2px 0;
  letter-spacing:0.02em;
}
.btn-add{
  background:var(--gold);
  color:#221c08;
  border:none;
  font-weight:800;
  font-size:14px;
  letter-spacing:0.02em;
  padding:13px 24px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:transform .12s, box-shadow .12s, background .12s;
  white-space:nowrap;
}
.btn-add:hover{ background:#f0c14f; box-shadow:0 6px 18px -6px rgba(232,179,57,0.5); }
.btn-add:active{ transform:translateY(1px); }
.btn-add:disabled{ opacity:0.5; cursor:not-allowed; box-shadow:none; }

.form-msg{
  font-size:13px;
  margin:10px 2px 28px;
  min-height:18px;
  color:var(--rust);
  font-weight:600;
}
.form-msg.success{ color:var(--sage); }

/* ===== Toolbar: search + filters ===== */
.toolbar{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px dashed var(--line);
}
.search-wrap{
  position:relative;
  flex:1 1 280px;
  max-width:380px;
}
.search-wrap input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--paper);
  font-size:14px;
  padding:11px 14px 11px 36px;
  border-radius:999px;
  outline:none;
  transition:border-color .15s;
}
.search-wrap input:focus{ border-color:var(--gold-dim); }
.search-wrap svg{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; stroke:var(--muted); pointer-events:none;
}

.filter-group{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filter-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:7px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper-dim);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.filter-chip:hover{ border-color:var(--gold-dim); color:var(--paper); }
.filter-chip.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#221c08;
  font-weight:700;
}

.sort-select{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--paper-dim);
  font-family:'Inter',sans-serif;
  font-size:13px;
  padding:9px 12px;
  border-radius:8px;
  outline:none;
  cursor:pointer;
}

.results-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--muted);
  margin-bottom:18px;
  letter-spacing:0.02em;
}
.results-meta strong{ color:var(--paper-dim); }

/* ===== Grid & cards ===== */
.movie-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:14px;
  list-style:none;
  margin:0;
  padding:0;
}

.movie-card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .18s ease, border-color .18s;
  display:flex;
  flex-direction:column;
}
.movie-card:hover{ transform:translateY(-4px); border-color:#4a4534; }

.poster-wrap{
  position:relative;
  aspect-ratio:2/3;
  background:linear-gradient(160deg, var(--surface-raised), #161409);
  overflow:hidden;
}
.poster-wrap img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.poster-fallback{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  gap:8px;
  color:var(--muted);
}
.poster-fallback svg{ width:34px; height:34px; opacity:0.5; }
.poster-fallback span{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.05em; }

.status-flag{
  position:absolute;
  top:8px; left:-1px;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  font-weight:600;
  padding:4px 10px 4px 8px;
  border-radius:0 4px 4px 0;
  color:#161409;
  box-shadow:0 3px 8px -2px rgba(0,0,0,0.5);
}
.status-flag::after{
  content:"";
  position:absolute;
  left:0; top:100%;
  border-style:solid;
  border-width:4px 0 0 6px;
  border-color:transparent transparent transparent currentColor;
  filter:brightness(0.6);
}
.status-flag[data-status="not_seen"]{ background:var(--grey-flag); }
.status-flag[data-status="watched"]{ background:var(--sage); }

.rating-pill{
  position:absolute;
  bottom:8px; right:8px;
  background:rgba(15,14,9,0.82);
  border:1px solid rgba(232,179,57,0.4);
  color:var(--gold);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:600;
  padding:3px 7px;
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:3px;
  backdrop-filter:blur(2px);
}
.rating-pill svg{ width:9px; height:9px; fill:var(--gold); }

.card-body{
  padding:10px 10px 10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}
.card-title-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
}
.card-title{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:13px;
  line-height:1.25;
  color:var(--paper);
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.updated-badge{
  flex:none;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:0.02em;
  color:var(--muted);
  white-space:nowrap;
}
.card-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--paper-dim);
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.card-meta .dot{ color:var(--line); }

.genre-tags{
  display:flex; gap:5px; flex-wrap:wrap;
}
.genre-tag{
  font-size:9px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:0.03em;
  text-transform:uppercase;
  color:var(--muted);
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  padding:2px 6px;
  border-radius:999px;
}

.card-plot{
  font-size:11px;
  color:var(--paper-dim);
  line-height:1.45;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  opacity:0.85;
}

.card-comment{
  font-size:11px;
  color:var(--gold-dim);
  font-style:italic;
  line-height:1.35;
  margin:0;
  padding-top:3px;
  border-top:1px dashed var(--line);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-actions{
  margin-top:auto;
  padding-top:8px;
  display:flex;
  gap:6px;
}
.card-actions button{
  flex:1;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  font-weight:600;
  padding:7px 6px;
  border-radius:6px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper-dim);
  cursor:pointer;
  transition:all .15s;
}
.card-actions button:hover{ border-color:var(--gold-dim); color:var(--gold); }
.card-actions button.danger:hover{ border-color:var(--rust); color:var(--rust); }

/* skeleton loading card */
.movie-card.skeleton .poster-wrap{
  background:linear-gradient(100deg, var(--surface-raised) 30%, #2c2818 50%, var(--surface-raised) 70%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
.skel-line{
  height:10px;
  border-radius:4px;
  background:var(--surface-raised);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{
  0%{ background-position:200% 0; }
  100%{ background-position:-200% 0; }
}

/* empty / error states */
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:var(--paper-dim);
}
.empty-state .icon{ font-size:0; margin-bottom:16px; }
.empty-state svg{ width:46px; height:46px; stroke:var(--muted); margin:0 auto 16px; display:block; }
.empty-state h3{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;
  letter-spacing:0.03em;
  color:var(--paper);
  margin:0 0 8px;
  font-weight:400;
}
.empty-state p{ font-size:13.5px; margin:0; max-width:340px; margin:0 auto; line-height:1.6; }
.empty-state a{ color:var(--gold); text-decoration:none; font-weight:600; }

/* ===== Modal (rich details + edit) ===== */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,9,6,0.75);
  backdrop-filter:blur(4px);
  display:flex; align-items:flex-start; justify-content:center;
  z-index:100;
  padding:24px;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
  overflow-y:auto;
}
.modal-overlay.is-open{ opacity:1; pointer-events:auto; }
.movie-edit-modal{
  background:var(--surface-raised);
  border:1px solid var(--line);
  border-radius:14px;
  width:100%;
  max-width:680px;
  padding:0;
  box-shadow:0 30px 60px -15px rgba(0,0,0,0.6);
  transform:translateY(12px) scale(0.97);
  transition:transform .18s;
  position:relative;
  overflow:hidden;
}
.modal-overlay.is-open .movie-edit-modal{ transform:translateY(0) scale(1); }

.modal-close{
  position:absolute;
  top:12px; right:12px;
  z-index:2;
  width:32px; height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  background:rgba(15,14,9,0.7);
  color:var(--paper-dim);
  font-size:18px;
  line-height:1;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s;
  backdrop-filter:blur(4px);
}
.modal-close:hover{ border-color:var(--rust); color:var(--rust); }

/* --- Header section: poster + title --- */
.modal-header{
  display:flex;
  gap:18px;
  padding:22px 22px 18px;
  border-bottom:1px solid var(--line);
}
.modal-poster{
  flex:none;
  width:120px;
  aspect-ratio:2/3;
  border-radius:8px;
  overflow:hidden;
  background:linear-gradient(160deg, var(--surface), #161409);
  box-shadow:0 8px 20px -8px rgba(0,0,0,0.6);
}
.modal-poster img{ width:100%; height:100%; object-fit:cover; display:block; }
.modal-poster-fallback{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  color:var(--muted);
}
.modal-poster-fallback svg{ width:30px; height:30px; opacity:0.4; }
.modal-header-info{ flex:1; min-width:0; padding-top:4px; }
.modal-header-info h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  font-weight:400;
  letter-spacing:0.02em;
  line-height:1.05;
  margin:0 0 6px;
  color:var(--paper);
}
.modal-type-badge{
  display:inline-block;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--gold-dim);
  border:1px solid var(--gold-dim);
  padding:2px 7px;
  border-radius:999px;
  margin-bottom:8px;
}
.modal-meta-line{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--paper-dim);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  margin-bottom:6px;
}
.modal-meta-line .dot{ color:var(--line); }
.modal-rating-row{
  display:flex; align-items:center; gap:8px;
  margin-top:6px;
}
.modal-rating-row .stars-icon{ width:14px; height:14px; fill:var(--gold); }
.modal-rating-row .rating-num{ font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; color:var(--gold); }
.modal-rating-row .vote-count{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); }
.modal-genres{ display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }

/* --- Body section: plot, cast, details --- */
.modal-body{
  padding:18px 22px;
  display:flex; flex-direction:column; gap:16px;
}
.modal-section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold-dim);
  margin:0 0 6px;
}
.modal-plot{
  font-size:13px;
  color:var(--paper-dim);
  line-height:1.6;
  margin:0;
}
.modal-people-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.modal-people-group h4{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--gold-dim);
  margin:0 0 8px;
}
.modal-person{
  display:flex; align-items:center; gap:8px;
  margin-bottom:6px;
}
.modal-person:last-child{ margin-bottom:0; }
.modal-person-avatar{
  flex:none;
  width:32px; height:32px;
  border-radius:50%;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--line);
}
.modal-person-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.modal-person-avatar-fallback{
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:var(--muted);
}
.modal-person-name{
  font-size:12px;
  color:var(--paper);
  font-weight:500;
  line-height:1.2;
}
.modal-person-prof{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--muted);
  text-transform:capitalize;
}
.modal-details-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 18px;
}
.modal-detail-item{
  display:flex; flex-direction:column; gap:2px;
}
.modal-detail-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--muted);
}
.modal-detail-value{
  font-size:12px;
  color:var(--paper-dim);
  line-height:1.4;
}
.modal-interests{
  display:flex; gap:5px; flex-wrap:wrap;
}
.modal-interest-tag{
  font-size:9.5px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:0.02em;
  color:var(--paper-dim);
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  padding:3px 8px;
  border-radius:999px;
}
.modal-interest-tag.subgenre{ color:var(--gold-dim); border-color:rgba(163,126,44,0.3); }

/* --- Edit section --- */
.modal-edit-section{
  padding:18px 22px 22px;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,0.12);
}
.modal-edit-section label{
  display:block;
  font-size:11.5px;
  font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--paper-dim);
  margin-bottom:8px;
}
.status-options{
  display:flex; gap:8px; margin-bottom:18px;
}
.status-option{
  flex:1;
  text-align:center;
  padding:10px 6px;
  border-radius:8px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper-dim);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s;
}
.status-option[data-status="not_seen"].active{ background:var(--grey-flag-dim); border-color:var(--grey-flag); color:var(--paper); }
.status-option[data-status="watched"].active{ background:var(--sage-dim); border-color:var(--sage); color:var(--paper); }
.modal-edit-section textarea{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:12px;
  border-radius:8px;
  resize:vertical;
  min-height:72px;
  outline:none;
  margin-bottom:12px;
  transition:border-color .15s;
  box-sizing:border-box;
}
.modal-edit-section textarea:focus{ border-color:var(--gold-dim); }
.modal-updated{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  margin-bottom:14px;
}
.modal-updated strong{ color:var(--paper-dim); }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
.modal-actions button{
  font-size:13px;
  font-weight:700;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper-dim);
  transition:all .15s;
}
.modal-actions .btn-save{ background:var(--gold); border-color:var(--gold); color:#221c08; }
.modal-actions .btn-save:hover{ background:#f0c14f; }
.modal-actions .btn-cancel:hover{ border-color:var(--rust); color:var(--rust); }
.modal-actions button:disabled{ opacity:0.5; cursor:not-allowed; }

@media (max-width:560px){
  .marquee{ padding:30px 18px 22px; }
  .toolbar{ flex-direction:column; align-items:stretch; }
  .filter-group{ justify-content:flex-start; }
  .modal-header{ flex-direction:column; align-items:center; text-align:center; }
  .modal-poster{ width:100px; }
  .modal-people-grid{ grid-template-columns:1fr; }
  .modal-details-grid{ grid-template-columns:1fr; }
  .modal-meta-line{ justify-content:center; }
  .modal-rating-row{ justify-content:center; }
  .modal-genres{ justify-content:center; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}
</style>
</head>
<body>

<section class="movies-section">

  <div class="marquee">
    <div class="marquee-inner">
      <h1>Movie <span class="accent">Tracker</span></h1>
      <div class="auth-row">
        <a href="https://rapid-lake-86f8.mahmoodjanlooali.workers.dev/login">Login with GitHub</a>
        <span class="sep">|</span>
        <a href="https://rapid-lake-86f8.mahmoodjanlooali.workers.dev/api/logout">Logout</a>
        <span class="sep">|</span>
        <span id="authStatus">checking session&hellip;</span>
      </div>
    </div>
  </div>

  <form id="movieForm" class="add-form">
    <div class="field-wrap">
      <input id="movieImdbId" type="text" placeholder="IMDb ID, e.g. tt0111161" required pattern="tt\d{7,8}" title="Format: tt followed by 7-8 digits" />
      <div class="field-hint">Find the ID in any IMDb URL &mdash; imdb.com/title/<strong>tt0111161</strong>/</div>
    </div>
    <button type="submit" class="btn-add" id="addBtn">+ Add movie</button>
  </form>
  <p class="form-msg" id="formMsg"></p>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search your collection&hellip;" />
    </div>
    <div class="filter-group" id="statusFilters">
      <button class="filter-chip active" data-filter="watched">Watched</button>
      <button class="filter-chip" data-filter="not_seen">Not seen</button>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="added_desc">Recently added</option>
      <option value="title_asc">Title A&ndash;Z</option>
      <option value="year_desc">Newest release</option>
      <option value="year_asc">Oldest release</option>
      <option value="rating_desc">Highest rated</option>
    </select>
  </div>

  <p class="results-meta" id="resultsMeta"></p>

  <ul class="movie-grid" id="movieList"></ul>

</section>

<div class="modal-overlay" id="modalOverlay">
  <div class="movie-edit-modal">
    <button type="button" class="modal-close" id="modalCloseBtn">&times;</button>

    <!-- Header: poster + title/meta -->
    <div class="modal-header">
      <div class="modal-poster" id="modalPoster"></div>
      <div class="modal-header-info">
        <span class="modal-type-badge" id="modalTypeBadge"></span>
        <h2 id="modalTitle"></h2>
        <div class="modal-meta-line" id="modalMetaLine"></div>
        <div class="modal-rating-row" id="modalRatingRow"></div>
        <div class="modal-genres" id="modalGenres"></div>
      </div>
    </div>

    <!-- Body: plot, cast, details -->
    <div class="modal-body" id="modalBody"></div>

    <!-- Edit section -->
    <div class="modal-edit-section">
      <label>Status</label>
      <div class="status-options" id="statusOptions">
        <button type="button" class="status-option" data-status="not_seen">Not seen</button>
        <button type="button" class="status-option" data-status="watched">Watched</button>
      </div>
      <label>Comment</label>
      <textarea id="commentInput" placeholder="Your thoughts on this one&hellip;"></textarea>
      <p class="modal-updated" id="modalUpdated"></p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="modalCancel">Cancel</button>
        <button type="button" class="btn-save" id="modalSave">Save changes</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
