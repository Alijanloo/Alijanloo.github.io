<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ali Janloo</title>
    <!-- Single Page Apps for GitHub Pages: redirect deep links to index.html -->
    <script type="text/javascript">
      (function (l) {
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
