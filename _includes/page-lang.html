{% comment %}
  Detect post/page language and set appropriate attributes
{% endcomment %}

{% if page.lang %}
  {% assign page_lang = page.lang %}
{% elsif page.path contains '_fa.md' %}
  {% assign page_lang = 'fa' %}
{% else %}
  {% assign page_lang = 'en' %}
{% endif %}

<script>
  // Set language attribute on HTML element for current page
  document.documentElement.setAttribute('lang', '{{ page_lang }}');
</script>
